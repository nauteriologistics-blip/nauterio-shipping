name: CI

# Spec section 36.1: "CI installs from locked dependencies; checks
# formatting, lint, type, unit/integration tests, build, dependency/license
# and secret scan." This workflow implements that gate. It does NOT deploy
# anything - see .github/workflows/deploy.yml (not created yet; deployment
# needs a real AWS account and named production approval per ADR 0001
# section 11 and CLAUDE.md's safety rules, neither of which exist yet).

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.20.0"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile - fails if lockfile is out of date)
        run: pnpm install --frozen-lockfile

  lint-and-typecheck:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint every workspace package
        run: pnpm -r lint
      - name: Typecheck every workspace package
        run: pnpm -r typecheck

  build:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages first (apps depend on their dist output)
        run: |
          pnpm --filter @nauterio/contracts build
          pnpm --filter @nauterio/configuration build
          pnpm --filter @nauterio/validation build
          pnpm --filter @nauterio/observability build
          pnpm --filter @nauterio/integrations build
      - name: Generate Prisma client
        run: pnpm --filter @nauterio/database generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public" # placeholder - prisma generate does not connect
      - name: Build database package
        run: pnpm --filter @nauterio/database build
      - name: Build apps
        run: |
          pnpm --filter @nauterio/api build
          pnpm --filter @nauterio/worker build
          pnpm --filter @nauterio/web build
          pnpm --filter @nauterio/admin build

  test:
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nauterio_test
          POSTGRES_USER: nauterio
          POSTGRES_PASSWORD: nauterio_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nauterio -d nauterio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://nauterio:nauterio_ci_only@localhost:5432/nauterio_test?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build database package (tests import compiled dist)
        run: |
          pnpm --filter @nauterio/contracts build
          pnpm --filter @nauterio/database generate
          pnpm --filter @nauterio/database build
      - name: Apply migrations to the CI database
        run: pnpm --filter @nauterio/database migrate:deploy
      - name: Run unit and integration tests
        run: pnpm -r test

  # Spec section 36.1: "dependency/license and secret scan."
  security-scan:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=high
        continue-on-error: true # advisory until a documented risk-acceptance process exists (spec 35.1)
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
