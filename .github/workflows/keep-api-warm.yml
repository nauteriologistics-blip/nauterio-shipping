name: Keep production API warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-production-api-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the no-index liveness endpoint
        run: curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 70 https://api.nauteriologistics.com/v1/healthz --output /dev/null
