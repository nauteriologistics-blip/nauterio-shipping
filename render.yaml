services:
  - type: web
    name: nauterio-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    preDeployCommand: pnpm db:migrate:deploy
    healthCheckPath: /v1/health
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOCAL_AUTH_MODE
        value: "false"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BUSINESS_INQUIRY_TO_EMAIL
        sync: false
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false
      - key: COGNITO_REGION
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: MALWARE_SCANNER_URL
        sync: false
      - key: MALWARE_SCANNER_TOKEN
        sync: false
      - key: PILOT_MODE
        value: "true"
      - key: PILOT_ALLOWED_EMAILS
        sync: false
